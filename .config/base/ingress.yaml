apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rise-server-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  ingressClassName: traefik
  rules:
  - host: placeholder.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rise-server-service
            port:
              number: 80
