name: Deploy dotnet app

on:
  push:
    branches:
      - main

jobs: 
  server:
    runs-on: self-hosted

    steps:
      - name: Sync latest repository code
        run: |
          cd ~/rise-dev-group-4
          git pull origin main

      - name: Publish dotnet app
        run: |
          cd ~/rise-dev-group-4/src/Rise.Server
          dotnet publish -c Release -o /var/www/rise-server
      