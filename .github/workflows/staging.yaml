---
name: Deploy dotnet app to staging environment

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: gussderuss/rise-staging
  TEST_CONTAINER_NAME: rise-server-staging

jobs: 
  build-test-env:
    name: Build image for test environment
    runs-on: [self-hosted, build-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      images_tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Compute short SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_STAGING_USERNAME }}
          password: ${{ secrets.DOCKERHUB_STAGING_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest

  deploy-test-env:
    name: Deploy to Test environment
    needs: build-test-env
    runs-on: [self-hosted, kubectl]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # - name: Log in to Docker hub
      #   uses: docker/login-action@v4
      #   with:
      #     username: ${{ secrets.DOCKERHUB_STAGING_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_STAGING_PULL_TOKEN }}

      - name: Rollout new image to cluster
        env:
          TAG: ${{ needs.build-test-env.outputs.images_tag }}
        run: |
          kubectl rollout restart deployment/rise-server -n staging
