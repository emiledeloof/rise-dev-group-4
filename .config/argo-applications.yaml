apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rise-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/emiledeloof/rise-dev-group-4.git
    targetRevision: main   
    path: .config/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rise-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/emiledeloof/rise-dev-group-4.git
    targetRevision: release
    path: .config/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true