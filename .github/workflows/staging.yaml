---
name: Deploy dotnet app to staging environment

on: 
  push:
    branches:
      - main

env:
  IMAGE_NAME: gussderuss/rise-staging
  TEST_CONTAINER_NAME: rise-server-staging

jobs: 
  build-test-env:
    name: Build image for test environment
    runs-on: [self-hosted, build-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      images_tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Compute short SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_STAGING_USERNAME }}
          password: ${{ secrets.DOCKERHUB_STAGING_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
          ${{ env.IMAGE_NAME }}:latest

  deploy-test-env:
    name: Deploy to Test environment
    needs: build-test-env
    runs-on: [self-hosted, prod-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Log in to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_STAGING_USERNAME }}
          password: ${{ secrets.DOCKERHUB_STAGING_PULL_TOKEN }}

      - name: Deploy container
        env:
          TAG: ${{ needs.build-test-env.outputs.images_tag }}
        run: |
          echo "Pulling image: $IMAGE_NAME:$TAG"
          docker pull "$IMAGE_NAME:$TAG"

          if docker ps -a --format '{{.Names}}' | grep -Eq "^${TEST_CONTAINER_NAME}\$"; then
            echo "Stopping and removing existing container..."
            docker stop "$TEST_CONTAINER_NAME"
            docker rm "$TEST_CONTAINER_NAME"
          fi

          echo "Starting container: $TEST_CONTAINER_NAME"
          docker volume create rise-logs-test
          docker run -d --name "$TEST_CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file /opt/rise/.env-test \
            -p 8080:8080 \
            -v rise-logs-test:/app/Logs \
            "$IMAGE_NAME:$TAG"

          sleep 3
          if docker ps --filter "name=^/${TEST_CONTAINER_NAME}$" --filter "status=running" | grep -q "$TEST_CONTAINER_NAME"; then
            echo "Deployment succeeded."
            docker image prune -f
          else
            echo "Deployment failed! Outputting logs:"
            docker logs "$TEST_CONTAINER_NAME"
            exit 1
          fi
