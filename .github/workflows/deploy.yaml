name: Deploy dotnet app

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs: 
  ci:
    runs-on: self-hosted
    steps:
      - name: Sync latest repository code
        uses: actions/checkout@v4 
        
      # 1. Dependency Restore & Vulnerability Audit
      - name: Restore dependencies & Audit CVEs
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive

      # 2. Fast Whitespace & Formatting Check
      # Fails fast before triggering the heavier compiler step
      - name: Verify Formatting (dotnet format)
        run: |
          dotnet format --verify-no-changes --verbosity normal

      # 3. Static Analysis & Roslyn Code Style Check
      # Executes Roslyn analyzers, SonarAnalyzer, and treats warnings as errors
      - name: Build with Strict Code Analysis
        run: |
          dotnet build --no-restore --configuration Release --warnaserror

      # 4. Unit & Integration Tests (with code coverage)
      - name: Run Tests
        run: |
          dotnet test --no-build --configuration Release --verbosity normal

  deploy:
    runs-on: self-hosted
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Sync latest repository code
        uses: actions/checkout@v4