---
name: Perform code checking

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: [self-hosted, build-server]
    steps:
    - name: Check out repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # 1. Secret Scanning
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --results=verified,unknown

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # 2. Dependency Restore & Built-in NuGet Audit (Fails on CVEs)
    - name: Restore dependencies & Audit CVEs
      run: |
        dotnet restore

    # 3. Check for Deprecated Packages (with allowlist)
    - name: Check for deprecated packages
      run: |
        output=$(dotnet list package --deprecated --include-transitive)
        echo "$output"
        
        # Filter out lines with '>' that DO NOT match our allowed packages
        # Note: '^   > xunit' matches both 'xunit' and transitive 'xunit.core', 'xunit.assert', etc.
        disallowed=$(echo "$output" | grep ">" | grep -vE "^[[:space:]]*>[[:space:]]*(xunit(\.[a-zA-Z0-9_.-]+)?)[[:space:]]" || true)
        
        if [ -n "$disallowed" ]; then
          echo "::error::Disallowed deprecated NuGet packages detected:"
          echo "$disallowed"
          exit 1
        fi

    # 4. Fast Whitespace Check
    - name: Verify Formatting
      run: |
        dotnet format whitespace --verify-no-changes --no-restore

    # 5. Build with Strict Code & Style Analysis
    - name: Build with Strict Code Analysis
      run: |
        dotnet build --no-restore --configuration Release --warnaserror \
          -p:ContinuousIntegrationBuild=true

    # 6. Unit & Integration Tests (with hang protection & coverage)
    - name: Run Tests with Coverage
      run: |
        dotnet test --no-build --configuration Release --verbosity normal \
          --blame-hang-timeout 2m \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults \
          --logger "trx;LogFileName=test-results.trx"

    # 7. Publish Coverage Summary to GitHub PR / Job Summary
    - name: Generate Code Coverage Report
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        reports: './TestResults/**/coverage.cobertura.xml'
        targetdir: './CoverageReport'
        reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub'

    # 8. Show Coverage Table directly in GitHub Actions UI
    - name: Publish Coverage to Job Summary
      run: cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    # 9. Upload full HTML report for download
    - name: Upload HTML Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: ./CoverageReport
        retention-days: 7